<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--color-paper);color:var(--color-ink)}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.s{display:flex;flex-direction:column;gap:6px}.c{block-size:64px;border:1px solid var(--color-line)}.n{font:600 13px/18px var(--font-sans)}.h{font:400 12px/18px var(--font-sans);color:var(--color-ink-subtle);direction:ltr;text-align:right}.k{font:400 12px/18px var(--font-sans);color:var(--color-ink-subtle)}</style></head><body><div class="sw"><div class="s"><div class="c" style="background:var(--color-paper)"></div><div class="n">paper</div><div class="h">#f2f3f5 / #0f1320</div><div class="k">page</div></div><div class="s"><div class="c" style="background:var(--color-raised)"></div><div class="n">raised</div><div class="h">#ffffff / #171c2c</div><div class="k">cards, form, nav</div></div><div class="s"><div class="c" style="background:var(--color-sunken)"></div><div class="n">sunken</div><div class="h">#e4e7ec / #0a0d16</div><div class="k">work strip, wells</div></div></div><div class="sw" data-theme="dark" style="margin-top:12px;padding:12px;background:var(--color-paper)"><div class="c" style="background:var(--color-paper);block-size:28px"></div><div class="c" style="background:var(--color-raised);block-size:28px"></div><div class="c" style="background:var(--color-sunken);block-size:28px"></div></div></body></html>
