<!-- @dsCard group="Colors" viewport="700x190" name="Firouzeh & status" subtitle="Firouzeh decorative only; status always with icon + word" -->
<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--color-paper);color:var(--color-ink)}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.s{display:flex;flex-direction:column;gap:6px}.c{block-size:64px;border:1px solid var(--color-line)}.n{font:600 13px/18px var(--font-sans)}.h{font:400 12px/18px var(--font-sans);color:var(--color-ink-subtle);direction:ltr;text-align:right}.k{font:400 12px/18px var(--font-sans);color:var(--color-ink-subtle)}</style></head><body><div class="sw"><div class="s"><div class="c" style="background:var(--color-firouzeh)"></div><div class="n">firouzeh</div><div class="h">#12a594 / #2cc4ae</div><div class="k">decorative, never text</div></div><div class="s"><div class="c" style="background:var(--color-success)"></div><div class="n">success</div><div class="h">#0b6b5c / #4fd1b8</div><div class="k">text + icon</div></div><div class="s"><div class="c" style="background:var(--color-success-tint)"></div><div class="n">success-tint</div><div class="h">#ddf3ee / #10312d</div><div class="k">ground</div></div><div class="s"><div class="c" style="background:var(--color-danger)"></div><div class="n">danger</div><div class="h">#b42318 / #ff8a7e</div><div class="k">text + icon</div></div><div class="s"><div class="c" style="background:var(--color-danger-tint)"></div><div class="n">danger-tint</div><div class="h">#fbe4e1 / #3a1815</div><div class="k">ground</div></div></div></body></html>
