<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--color-paper);color:var(--color-ink)}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.s{display:flex;flex-direction:column;gap:6px}.c{block-size:64px;border:1px solid var(--color-line)}.n{font:600 13px/18px var(--font-sans)}.h{font:400 12px/18px var(--font-sans);color:var(--color-ink-subtle);direction:ltr;text-align:right}.k{font:400 12px/18px var(--font-sans);color:var(--color-ink-subtle)}.g{display:grid;grid-template-columns:1fr 1fr;gap:32px}</style></head><body><div class="g"><div class="s"><button style="all:unset;padding:10px 18px;border:1px solid var(--color-line-strong);border-radius:6px;outline:2px solid var(--color-focus-ring);outline-offset:2px;font-weight:600;align-self:flex-start">فوکوس</button><div class="n" style="margin-top:8px">focus-ring</div><div class="h">#16258f / #b5c0ff</div></div><div class="s"><div style="position:relative;block-size:72px;background:var(--color-raised);border:1px solid var(--color-line)"><div style="position:absolute;inset:0;background:var(--color-scrim)"></div></div><div class="n">scrim</div><div class="h">rgba(21,25,34,.56) / rgba(5,7,12,.7)</div></div></div></body></html>
