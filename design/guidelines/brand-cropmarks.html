<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--color-paper);color:var(--color-ink)}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.s{display:flex;flex-direction:column;gap:6px}.c{block-size:64px;border:1px solid var(--color-line)}.n{font:600 13px/18px var(--font-sans)}.h{font:400 12px/18px var(--font-sans);color:var(--color-ink-subtle);direction:ltr;text-align:right}.k{font:400 12px/18px var(--font-sans);color:var(--color-ink-subtle)}.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;align-items:center}.k p{margin:0 0 8px;font-size:13px;line-height:24px}</style></head><body><div class="g"><div class="gw-crop-frame" style="--gw-crop-gap:20px;--gw-crop-len:14px"><span class="gw-crop gw-crop--ts"></span><span class="gw-crop gw-crop--te"></span><span class="gw-crop gw-crop--bs"></span><span class="gw-crop gw-crop--be"></span><div class="gw-cover" style="background:var(--color-lapis-tint)"></div></div><div class="gw-crop-frame" style="--gw-crop-gap:20px;--gw-crop-len:14px;--gw-crop-color:var(--color-lapis)"><span class="gw-crop gw-crop--ts"></span><span class="gw-crop gw-crop--te"></span><span class="gw-crop gw-crop--bs"></span><span class="gw-crop gw-crop--be"></span><div class="gw-cover" style="background:var(--color-lapis)"></div></div><div class="k"><p><b>استراحت:</b> تیک‌ها 1px با line-strong، طول ۱۰ تا ۱۴px، با فاصله از لبه‌ی کاور.</p><p><b>هاور:</b> تیک‌ها لاجوردی می‌شوند.</p><p>فقط دور کاور پروژه و قاب‌های هیرو. هرگز دور متن، دکمه یا فرم.</p></div></div></body></html>
