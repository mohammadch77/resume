<!-- @dsCard group="Brand" viewport="1280x720" name="Cover" subtitle="Lapis, saffron, ink, firouzeh, lapis-tint blocks; plus-marks at 64px pitch" -->
<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--color-paper)}.cv{position:relative;inline-size:1280px;block-size:720px;overflow:hidden;background:var(--color-paper)}.pm{position:absolute;inline-size:13px;block-size:13px;transform:translate(-6px,-6px)}.pm::before,.pm::after{content:"";position:absolute;background:var(--color-line-strong)}.pm::before{left:0;top:6px;width:13px;height:1px}.pm::after{left:6px;top:0;width:1px;height:13px}.b{position:absolute}.name{position:absolute;left:64px;bottom:56px;font:800 112px/1 var(--font-display);color:var(--color-ink);letter-spacing:-0.02em}.sub{position:absolute;left:68px;bottom:184px;font:600 20px/28px var(--font-sans);color:var(--color-ink-muted)}</style></head><body><div class="cv" id="cv">
<div class="b" style="left:480px;top:0;width:544px;height:448px;background:var(--color-lapis)"></div>
<div class="b" style="left:1024px;top:0;width:256px;height:192px;background:var(--color-saffron)"></div>
<div class="b" style="left:1024px;top:192px;width:256px;height:384px;background:var(--color-lapis-tint)"></div>
<div class="b" style="left:480px;top:448px;width:288px;height:272px;background:var(--color-ink)"></div>
<div class="b" style="left:768px;top:448px;width:256px;height:128px;background:var(--color-firouzeh)"></div>
<div class="sub" lang="fa" dir="rtl">سامانه‌ی طراحی</div>
<div class="name">Grin Web</div>
</div><script>const cv=document.getElementById('cv');for(let x=64;x<1280;x+=64)for(let y=64;y<720;y+=64){if(x>480&&!(x>768&&y>576))continue;const s=document.createElement('span');s.className='pm';s.style.left=x+'px';s.style.top=y+'px';cv.prepend(s)}</script></body></html>
