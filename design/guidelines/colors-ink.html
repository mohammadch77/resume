<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--color-paper);color:var(--color-ink)}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.s{display:flex;flex-direction:column;gap:6px}.c{block-size:64px;border:1px solid var(--color-line)}.n{font:600 13px/18px var(--font-sans)}.h{font:400 12px/18px var(--font-sans);color:var(--color-ink-subtle);direction:ltr;text-align:right}.k{font:400 12px/18px var(--font-sans);color:var(--color-ink-subtle)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}</style></head><body><div class="g"><div style="background:var(--color-paper);padding:14px 16px;border:1px solid var(--color-line)"><div class="k" style="margin-bottom:6px">روی paper</div><div style="color:var(--color-ink);font-weight:600">ink — متن اصلی</div><div style="color:var(--color-ink-muted)">ink-muted — توضیح</div><div style="color:var(--color-ink-subtle);font-size:13px">ink-subtle — منبع، راهنما</div></div><div style="background:var(--color-raised);padding:14px 16px;border:1px solid var(--color-line)"><div class="k" style="margin-bottom:6px">روی raised</div><div style="color:var(--color-ink);font-weight:600">ink — متن اصلی</div><div style="color:var(--color-ink-muted)">ink-muted — توضیح</div><div style="color:var(--color-ink-subtle);font-size:13px">ink-subtle — منبع، راهنما</div></div><div style="background:var(--color-sunken);padding:14px 16px;border:1px solid var(--color-line)"><div class="k" style="margin-bottom:6px">روی sunken</div><div style="color:var(--color-ink);font-weight:600">ink — متن اصلی</div><div style="color:var(--color-ink-muted)">ink-muted — توضیح</div><div style="color:var(--color-ink-subtle);font-size:13px">ink-subtle — منبع، راهنما</div></div></div></body></html>
