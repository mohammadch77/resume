<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--color-paper);color:var(--color-ink)}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.s{display:flex;flex-direction:column;gap:6px}.c{block-size:64px;border:1px solid var(--color-line)}.n{font:600 13px/18px var(--font-sans)}.h{font:400 12px/18px var(--font-sans);color:var(--color-ink-subtle);direction:ltr;text-align:right}.k{font:400 12px/18px var(--font-sans);color:var(--color-ink-subtle)}.r{display:grid;grid-template-columns:120px 60px 170px 1fr;align-items:center;gap:12px;padding-block:8px;border-bottom:1px solid var(--color-line)}.t{position:relative;block-size:12px;border-bottom:1px solid var(--color-line-strong)}.t i{position:absolute;inset-inline-start:0;top:0;inline-size:12px;block-size:12px;background:var(--color-lapis);transition-property:transform;transition-timing-function:var(--ease-out)}.r:hover .t i{transform:translateX(-200px)}</style></head><body><div class="r"><span class="n" dir="ltr">duration-fast</span><span class="h">140ms</span><span class="k">hover, press, color</span><span class="t"><i style="transition-duration:var(--duration-fast)"></i></span></div><div class="r"><span class="n" dir="ltr">duration-base</span><span class="h">240ms</span><span class="k">modal, menu sheet</span><span class="t"><i style="transition-duration:var(--duration-base)"></i></span></div><div class="r"><span class="n" dir="ltr">duration-slow</span><span class="h">700ms</span><span class="k">hero entrance, cover zoom</span><span class="t"><i style="transition-duration:var(--duration-slow)"></i></span></div><div class="k" style="margin-top:12px" dir="ltr">ease-out cubic-bezier(0.2,0.7,0.1,1) · ease-standard cubic-bezier(0.65,0,0.35,1) · z-nav 40 · z-modal 100 · z-toast 110</div></body></html>
