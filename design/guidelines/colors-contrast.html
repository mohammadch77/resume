<!-- @dsCard group="Colors" viewport="700x700" name="Contrast pairs" subtitle="Live WCAG ratios, both themes (4.5:1 text, 3:1 borders/focus)" -->
<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--color-paper);color:var(--color-ink)}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.s{display:flex;flex-direction:column;gap:6px}.c{block-size:64px;border:1px solid var(--color-line)}.n{font:600 13px/18px var(--font-sans)}.h{font:400 12px/18px var(--font-sans);color:var(--color-ink-subtle);direction:ltr;text-align:right}.k{font:400 12px/18px var(--font-sans);color:var(--color-ink-subtle)}table{inline-size:100%;border-collapse:collapse;font:400 13px/20px var(--font-sans)}th{text-align:start;font-weight:600;color:var(--color-ink-muted);padding:4px 8px;border-bottom:1px solid var(--color-line-strong)}td{padding:3px 8px;border-bottom:1px solid var(--color-line)}td.r{direction:ltr;text-align:right;font-weight:600}.sm{padding:0 8px;display:inline-block}.ok{color:var(--color-success)}.bad{color:var(--color-danger)}</style></head><body><table><thead><tr><th>متن / زمینه</th><th>نمونه</th><th>روشن</th><th>تیره</th></tr></thead><tbody id="t"></tbody></table><div id="probe" style="display:none"></div><div id="probeD" data-theme="dark" style="display:none"></div><script>
const P=[["ink","paper"],["ink","raised"],["ink","sunken"],["ink-muted","paper"],["ink-muted","raised"],["ink-muted","sunken"],["ink-subtle","paper"],["ink-subtle","raised"],["ink-subtle","sunken"],["lapis-text","paper"],["lapis-text","raised"],["lapis-text","lapis-tint"],["on-lapis","lapis"],["on-lapis","lapis-deep"],["on-saffron","saffron"],["saffron-text","paper"],["saffron-text","saffron-tint"],["success","success-tint"],["success","raised"],["danger","danger-tint"],["danger","raised"],["paper","ink"],["line-strong","raised","3"],["focus-ring","paper","3"]];
function rgb(v){const m=v.match(/[\d.]+/g).map(Number);return m.slice(0,3)}
function L(c){return c.map(x=>{x/=255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)}).reduce((a,x,i)=>a+x*[.2126,.7152,.0722][i],0)}
function get(el,tok){el.style.color='var(--color-'+tok+')';return rgb(getComputedStyle(el).color)}
function ratio(el,a,b){const A=L(get(el,a)),B=L(get(el,b));return (Math.max(A,B)+.05)/(Math.min(A,B)+.05)}
const pl=document.getElementById('probe'),pd=document.getElementById('probeD');
document.getElementById('t').innerHTML=P.map(([f,g,min])=>{const m=+(min||4.5);const a=ratio(pl,f,g),d=ratio(pd,f,g);const c=x=>'<td class="r '+(x>=m?'ok':'bad')+'">'+x.toFixed(2)+(x>=m?' ✓':' ✗')+'</td>';return '<tr><td>'+f+' / '+g+(min?' (3:1)':'')+'</td><td><span class="sm" style="color:var(--color-'+f+');background:var(--color-'+g+')">نمونه</span> <span class="sm" data-theme="dark" style="color:var(--color-'+f+');background:var(--color-'+g+')">نمونه</span></td>'+c(a)+c(d)+'</tr>'}).join('');</script></body></html>
