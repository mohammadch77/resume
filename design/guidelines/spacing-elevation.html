<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--color-paper);color:var(--color-ink)}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.s{display:flex;flex-direction:column;gap:6px}.c{block-size:64px;border:1px solid var(--color-line)}.n{font:600 13px/18px var(--font-sans)}.h{font:400 12px/18px var(--font-sans);color:var(--color-ink-subtle);direction:ltr;text-align:right}.k{font:400 12px/18px var(--font-sans);color:var(--color-ink-subtle)}body{background:var(--color-sunken)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.b{background:var(--color-raised);padding:20px;block-size:110px}</style></head><body><div class="g"><div class="b" style="border:1px solid var(--color-line)"><div class="n">کارت / بخش</div><div class="k">1px line، بدون سایه</div></div><div class="b" style="border:1px solid var(--color-line-strong);border-radius:6px"><div class="n">کنترل</div><div class="k">1px line-strong</div></div><div class="b" style="border:1px solid var(--color-line);border-radius:12px;box-shadow:var(--shadow-overlay)"><div class="n">پنجره‌ی شناور</div><div class="k">shadow-overlay — فقط Modal</div></div></div></body></html>
