services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: grinweb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grinweb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/grinweb
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      UPLOADS_DIR: /uploads
    volumes:
      - uploads:/uploads
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
