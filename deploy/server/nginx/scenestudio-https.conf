# Scene Studio (phase "https"). Only these two names; no other vhost is touched. App on 127.0.0.1:3190, uploads straight from disk.
server {
    listen 80;
    listen [::]:80;
    server_name www.scenestudio.ir scenestudio.ir;

    location /.well-known/acme-challenge/ { root /var/www/scenestudio-acme; }
    location / { return 301 https://www.scenestudio.ir$request_uri; }
}

# the bare domain only redirects
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scenestudio.ir;

    ssl_certificate     /etc/letsencrypt/live/www.scenestudio.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.scenestudio.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ss_ssl:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://www.scenestudio.ir$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.scenestudio.ir;

    ssl_certificate     /etc/letsencrypt/live/www.scenestudio.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.scenestudio.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ss_ssl:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # behind ArvanCloud: the visitor's address comes from X-Forwarded-For, trusted only from Arvan's own ranges (generated by setup-server.sh https)
    include /etc/nginx/snippets/scenestudio-realip.conf;

    location /.well-known/acme-challenge/ { root /var/www/scenestudio-acme; }

    # HSTS_PLACEHOLDER (enabled later by: setup-server.sh hsts, after https is confirmed to work)

    access_log /var/log/nginx/scenestudio.access.log;
    error_log  /var/log/nginx/scenestudio.error.log warn;

    client_max_body_size 1m;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

    # uploads: straight from disk, content-addressed names, so immutable
    location /uploads/ {
        alias /opt/scenestudio/data/uploads/;
        types { image/avif avif; image/webp webp; image/jpeg jpg jpeg; image/png png; video/mp4 mp4; video/webm webm; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # the admin takes uploads up to ~41 MB (video + image + form overhead)
    location /admin {
        client_max_body_size 45m;
        limit_req zone=scenestudio_login burst=5 nodelay;
        include /etc/nginx/snippets/scenestudio-proxy.conf;
    }

    location / {
        limit_req zone=scenestudio_contact burst=3 nodelay;
        include /etc/nginx/snippets/scenestudio-proxy.conf;
    }
}
