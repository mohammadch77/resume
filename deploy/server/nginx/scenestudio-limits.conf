# Scene Studio: request limits. Zone and map names all start with ss_ / scenestudio_ so they cannot collide with other projects' names.
# A POST to the login page or to the pages that host the contact form (a Next server action posts to the page URL) gets a per-IP key;
# every other request has an empty key and is not limited.
map "$request_method$uri" $ss_login_key   { default ""; "POST/admin/login" $binary_remote_addr; }
map "$request_method$uri" $ss_contact_key { default ""; "POST/" $binary_remote_addr; "POST/contact" $binary_remote_addr; }
limit_req_zone $ss_login_key   zone=scenestudio_login:10m   rate=10r/m;
limit_req_zone $ss_contact_key zone=scenestudio_contact:10m rate=6r/m;
limit_req_status 429;
