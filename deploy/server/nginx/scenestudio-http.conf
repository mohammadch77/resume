# Scene Studio, port 80 only (phase "http"): serves the ACME challenge folder, sends everything else to https.
server {
    listen 80;
    listen [::]:80;
    server_name www.scenestudio.ir scenestudio.ir;

    location /.well-known/acme-challenge/ { root /var/www/scenestudio-acme; }
    location = /ss-ping.txt { root /var/www/scenestudio-acme; }
    location / { return 301 https://www.scenestudio.ir$request_uri; }
}
